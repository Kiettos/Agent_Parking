behaviors:
  CarParking:
    trainer_type: ppo
    
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3          # Hệ số khám phá (entropy bonus)
      epsilon: 0.2          # Giới hạn cập nhật của PPO
      lambd: 0.95           # Hệ số GAE
      num_epoch: 3
      learning_rate_schedule: linear
      
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      
    reward_signals:
      extrinsic:
        gamma: 0.99         # Chiết khấu (nhìn xa ~100 bước)
        strength: 1.0
        
    keep_checkpoints: 5
    max_steps: 5.0e6        # Tổng số bước train (5 triệu)
    time_horizon: 128       # Thu thập 128 bước mỗi Agent trước khi update
    summary_freq: 10000     # Cứ 10.000 bước thì in báo cáo 1 lần